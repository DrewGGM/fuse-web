name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Needed only by the deploy job, to post the live URL back onto the commit.
  deployments: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # The gate that matters here. The vendored simulation must behave exactly
      # like the Android build's, because both submit to the same leaderboard.
      # A drift means one of them is producing scores the other cannot reproduce.
      - name: Shared core has not drifted
        run: npm run core:check

      - run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy
  #
  # Runs only after `verify` passes, and only on main. `needs` is what makes that
  # true: a push whose tests fail never reaches this job, so a broken build
  # cannot reach fuse.andrewgarcia.dev.
  #
  # The core-drift check inside `verify` matters most here. Web and Android
  # submit to the same leaderboard, so shipping a web build whose simulation has
  # drifted would start producing scores the server cannot reproduce.
  # ---------------------------------------------------------------------------
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A second push while one deploy is in flight waits rather than racing it —
    # two `wrangler deploy` runs against one Worker is a coin toss over which
    # version survives.
    concurrency:
      group: deploy-fuse-web
      cancel-in-progress: false

    environment:
      name: production
      url: https://fuse.andrewgarcia.dev

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Until the two secrets exist this job reports a notice and stops, rather
      # than failing. A red X on every push for a setup step nobody has done yet
      # teaches people to ignore red X's.
      - name: Are the Cloudflare credentials configured?
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in repository secrets. See docs/continuous-deployment.md"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for production
        if: steps.creds.outputs.ready == 'true'
        # FUSE_API_BASE sets the API the client calls *and* the CSP's
        # connect-src, so they cannot fall out of step. Overridable as a
        # repository variable if the API ever moves.
        env:
          FUSE_API_BASE: ${{ vars.FUSE_API_BASE || 'https://api.fuse.andrewgarcia.dev' }}
        run: npm run build

      # The API goes first: a site deployed against a schema that has not been
      # migrated yet would 500 on its first submission.
      - name: Apply database migrations
        if: steps.creds.outputs.ready == 'true'
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply fuse-web-db --remote

      - name: Deploy the API
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy

      - name: Deploy the site
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      # A deploy that returns success but serves a broken page is worse than a
      # failed one, because nothing tells you. This loads the live site in a real
      # browser and fails the run on a CSP violation, a rejected manifest or a
      # service worker that does not take control.
      - name: Verify what actually went live
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -e
          api="${{ vars.FUSE_API_BASE || 'https://api.fuse.andrewgarcia.dev' }}"

          # A deployed Worker that cannot reach its database returns 500 on the
          # first real request. Better to learn that here than from a player.
          code=$(curl -s -o /tmp/body.json -w '%{http_code}' -X POST "$api/v1/players")
          echo "POST /v1/players -> $code"
          test "$code" = "201"
          grep -q '"token"' /tmp/body.json

          # And a site that deploys successfully can still serve a broken CSP,
          # a rejected manifest, or a service worker that never takes control.
          npx playwright install --with-deps chromium
          node scripts/verify-web.mjs https://fuse.andrewgarcia.dev
