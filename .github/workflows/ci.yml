name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      # The gate that matters here. The vendored simulation must behave exactly
      # like the Android build's, because both submit to the same leaderboard.
      # A drift means one of them is producing scores the other cannot reproduce.
      - name: Shared core has not drifted
        run: npm run core:check

      - run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
